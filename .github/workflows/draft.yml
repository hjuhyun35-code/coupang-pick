name: 오늘의 픽 만들기

on:
  workflow_dispatch:
    inputs:
      count:
        description: "몇 건 만들지 (비우면 config.json 의 하루_개수)"
        required: false
        default: ""
      sample:
        description: "1 이면 쿠팡 API 없이 시험용 상품으로 돌립니다"
        required: false
        default: ""
  schedule:
    # 매일 오전 10시(한국). 자동발행이 꺼져 있으면 초안만 만들고 텔레그램으로 보냅니다.
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: daily-pick
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        # 폰트가 없으면 카드의 한글이 전부 네모(□)로 나옵니다.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 상품 고르고 글·카드 만들기
        id: gen
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRAFT_COUNT: ${{ inputs.count }}
          SAMPLE: ${{ inputs.sample }}
        run: python scripts/generate.py

      - name: 결과 커밋
        if: steps.gen.outputs.count != '0'
        run: |
          git config user.name "coupang-pick-bot"
          git config user.email "coupang-pick-bot@users.noreply.github.com"
          git add posts
          git diff --staged --quiet || git commit -m "초안 ${{ steps.gen.outputs.slugs }}"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 거부됨 ($i/3). 원격 변경을 받아 다시 시도합니다."
            git pull --rebase --autostash -q origin main || true
            sleep 5
          done
          git push

      - name: 자동발행이 켜져 있으면 바로 올리기
        if: steps.gen.outputs.count != '0' && inputs.sample != '1'
        env:
          SLUG: ${{ steps.gen.outputs.slugs }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          AUTO=$(python -c "import json;print(json.load(open('config.json',encoding='utf-8'))['발행'].get('자동발행',False))")
          if [ "$AUTO" = "True" ]; then
            # 이미지가 raw.githubusercontent 에 퍼질 때까지 잠깐 기다립니다.
            sleep 20
            CONFIRM=PUBLISH python scripts/publish.py
            git add posts
            git diff --staged --quiet || git commit -m "발행 ${{ steps.gen.outputs.slugs }}"
            git push || (git pull --rebase --autostash -q origin main && git push)
          else
            echo "자동발행이 꺼져 있습니다. 초안만 남깁니다."
          fi

      - name: 텔레그램으로 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLUGS: ${{ steps.gen.outputs.slugs }}
        run: python scripts/notify.py

      - name: 만든 것 미리보기 (Actions 화면에서도 볼 수 있게)
        if: steps.gen.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: posts/**/card.jpg
          retention-days: 14
          if-no-files-found: ignore
