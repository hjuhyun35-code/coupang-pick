<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg-a: #FFFFFF; --bg-b: #F3F3F1;
    --ink: #141414; --ink-soft: #3D3D3D; --ink-dim: #8A8A8A;
    --accent: #E23E2C; --line: rgba(20,20,20,0.10);
    --badge-bg: #E9F2FF; --badge-ink: #1E63C8;
  }
  body.t-쪽빛 {
    --bg-a: #16233A; --bg-b: #0E1626;
    --ink: #F2F5FA; --ink-soft: #BFCADB; --ink-dim: #7A8699;
    --accent: #7FB3E8; --line: rgba(242,245,250,0.13);
    --badge-bg: rgba(127,179,232,0.18); --badge-ink: #BFD9F5;
  }
  body.t-아이보리 {
    --bg-a: #FBF6EC; --bg-b: #F3EADA;
    --ink: #241F19; --ink-soft: #4A4137; --ink-dim: #8C8172;
    --accent: #B4703A; --line: rgba(36,31,25,0.14);
    --badge-bg: rgba(180,112,58,0.14); --badge-ink: #8A4E1E;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1350px;
    background: var(--bg-b);
    font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo",
                 "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  .card {
    position: relative; width: 1080px; height: 1350px;
    padding: 84px 88px 72px;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%);
    overflow: hidden;
  }
  .kicker {
    font-size: 30px; letter-spacing: 0.08em; color: var(--ink-dim); font-weight: 600;
  }
  .hook {
    margin-top: 18px;
    font-size: 70px; line-height: 1.22; font-weight: 800; letter-spacing: -0.02em;
    word-break: keep-all;
  }
  .photo {
    margin-top: 44px;
    width: 904px; height: 560px;
    border-radius: 28px;
    background: #fff;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .photo img { max-width: 92%; max-height: 92%; object-fit: contain; }
  .photo .empty { color: var(--ink-dim); font-size: 30px; }
  .body {
    margin-top: 40px;
    font-size: 36px; line-height: 1.5; color: var(--ink-soft); word-break: keep-all;
  }
  .name {
    margin-top: 28px; font-size: 28px; color: var(--ink-dim); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .row {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 28px; border-top: 1px solid var(--line);
  }
  .price { font-size: 52px; font-weight: 800; color: var(--accent); letter-spacing: -0.01em; }
  .badge {
    font-size: 26px; font-weight: 700; padding: 10px 20px; border-radius: 999px;
    background: var(--badge-bg); color: var(--badge-ink);
  }
  .foot {
    margin-top: 22px; display: flex; justify-content: space-between;
    font-size: 22px; color: var(--ink-dim);
  }
</style>
</head>
<body class="t-{{ theme }}">
<div class="card">
  <div class="kicker">{{ kicker }}</div>
  <div class="hook">{{ hook }}</div>
  <div class="photo">
    {% if image %}<img src="{{ image }}" alt="">{% else %}<div class="empty">사진 없음</div>{% endif %}
  </div>
  <div class="body">{% for line in body_lines %}{{ line }}<br>{% endfor %}</div>
  <div class="name">{{ name }}</div>
  <div class="row">
    <div class="price">{{ price }}</div>
    {% if rocket %}<div class="badge">로켓배송</div>{% endif %}
  </div>
  <div class="foot">
    <span>{{ handle }}</span>
    <span>{{ notice_short }}</span>
  </div>
</div>
</body>
</html>
